<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found · Code Sketchers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0b;
            --yellow: #fed000;
            --white: #ffffff;
            --muted: #8e908c;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--white);
        }
        .brand-mark {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.06em;
        }
        .brand-mark span { color: var(--yellow); }
        .brand-text {
            font-size: 9px;
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--muted);
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 680px;
            margin: auto;
        }
        .error-tag {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.16em;
            color: var(--yellow);
            text-transform: uppercase;
            margin-bottom: 16px;
            display: inline-block;
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(52px, 8vw, 96px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
        }
        h1 span {
            font-style: italic;
            color: var(--yellow);
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--muted);
            margin-bottom: 32px;
            max-width: 460px;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--yellow);
            color: #0b0b0b;
            padding: 14px 28px;
            border-radius: 4px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .btn-home:hover {
            background: var(--white);
            transform: translateY(-2px);
        }
        footer {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html#hero">
            <div class="brand-mark">C<span>•</span>S</div>
            <div class="brand-text">CODE<br>SKETCHERS</div>
        </a>
        <span style="font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:0.1em;">ERROR 404</span>
    </header>

    <main>
        <span class="error-tag">00 / LOST IN SPACE</span>
        <h1>Off the<br><span>blueprint.</span></h1>
        <p>The screen or path you are looking for has been moved, removed, or doesn't exist in our project directory.</p>
        <a href="index.html#hero" class="btn-home">RETURN TO STUDIO <span>↗</span></a>
    </main>

    <footer>
        <span>© 2026 CODE SKETCHERS. ALL RIGHTS RESERVED.</span>
        <span>CHENNAI · EVERYWHERE</span>
    </footer>
</body>
</html>
